  fichier variable impose une indirection — c'est le rôle de cette page. Elle

  pastille « Nouveau » de l'accueil) et remplace la page par le jeu.
  Voir docs/adr/0037-le-jeu-du-moment-une-page-statique-et-une-url-imprimee.md

  ⛔ AUCUN SCRIPT EN LIGNE ICI, et aucun domaine externe : la page doit rester
  servable sous une CSP stricte. Tout le comportement vit dans js/mat-jeu.js.

  un sous-répertoire n'ait rien à réécrire.
-->
<link rel="icon" href="../icon-192.png">
<link rel="stylesheet" href="../css/mat-jeu.css?v=1.1.0">
