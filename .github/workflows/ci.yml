name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : `scripts/check-cache-bust.js` compare la
          # branche à `origin/main` pour repérer un module modifié dont le
          # `?v=` n'a pas bougé. Avec un clone superficiel, ce contrôle
          # s'ignore silencieusement — donc ne sert à rien.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Syntax check (js/ + service-worker)
        run: |
          find js/ -name '*.js' | sort | xargs -I{} node --check {}
          node --check service-worker.js

      # Une accolade orpheline dans une feuille de style ne casse pas la page :
      # elle fait disparaître SILENCIEUSEMENT la seule règle qui la suit. Les
      # étoiles du ciel nocturne ont ainsi été invisibles une semaine. ADR-0015.
      - name: Structure check (css/)
        run: node scripts/check-css.js

      # Le service worker sert la copie en cache tant que l'URL est identique.
      # `mat-boot.js` a été modifié trois fois sans que son `?v=` bouge : les
      # habitants ont reçu l'ancien module pendant deux versions, avec un
      # bouton visible mais mort. Voir ADR-0019.
      - name: Cache-busting check (?v=)
        run: node scripts/check-cache-bust.js
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}

      # Le re-raccordement des tokens de suivi ne peut PAS être testé de bout en
      # bout : le service worker est bloqué sous Playwright (ADR-0006) et
      # `pushsubscriptionchange` est déclenché par le navigateur, des semaines
      # plus tard. Un habitant cessait de recevoir les réponses de la mairie
      # sans le moindre signal, ni côté app ni côté admin. Voir ADR-0034.
      - name: Notification relink check
        run: node scripts/check-notify-relink.js

      # `null == false` est VRAI dans une expression Actions (les deux opérandes
      # sont castés en nombre). Une entrée `workflow_dispatch` comparée à `false`
      # se déclenche donc toute seule hors lancement manuel : les mises à jour
      # mineures de `dependabot-auto-merge.yml` étaient désactivées dans le seul
      # mode qui compte, et le lancement manuel — le seul qu'on essaie — prenait
      # le bon chemin. Voir ADR-0045 §8.
      - name: Workflow inputs check (null == false)
        run: node scripts/check-workflow-inputs.js

      # Une spec E2E qui ne coupe pas `onrender.com` appelle le backend de
      # PRODUCTION à chaque exécution — et Playwright partant d'un profil
      # vierge, CHAQUE TEST s'y enregistre comme un visiteur unique de plus.
      # Six specs étaient dans ce cas, la première depuis le 31 août 2026 : le
      # tableau de bord de la mairie a affiché jusqu'à ~550 visiteurs par jour.
      # Aucun test ne peut voir ce défaut — il porte sur ce que les tests
      # eux-mêmes font. Voir ADR-0048.
      - name: E2E — aucune spec ne parle à la production
        run: node scripts/check-e2e-reseau.js
