name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Syntax check (js/ + service-worker)
        run: |
          find js/ -name '*.js' | sort | xargs -I{} node --check {}
          node --check service-worker.js

      # Une accolade orpheline dans une feuille de style ne casse pas la page :
      # elle fait disparaître SILENCIEUSEMENT la seule règle qui la suit. Les
      # étoiles du ciel nocturne ont ainsi été invisibles une semaine. ADR-0015.
      - name: Structure check (css/)
        run: node scripts/check-css.js
