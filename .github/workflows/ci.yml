name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Historique complet : `scripts/check-cache-bust.js` compare la
          # branche à `origin/main` pour repérer un module modifié dont le
          # `?v=` n'a pas bougé. Avec un clone superficiel, ce contrôle
          # s'ignore silencieusement — donc ne sert à rien.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Syntax check (js/ + service-worker)
        run: |
          find js/ -name '*.js' | sort | xargs -I{} node --check {}
          node --check service-worker.js

      # Une accolade orpheline dans une feuille de style ne casse pas la page :
      # elle fait disparaître SILENCIEUSEMENT la seule règle qui la suit. Les
      # étoiles du ciel nocturne ont ainsi été invisibles une semaine. ADR-0015.
      - name: Structure check (css/)
        run: node scripts/check-css.js

      # Le service worker sert la copie en cache tant que l'URL est identique.
      # `mat-boot.js` a été modifié trois fois sans que son `?v=` bouge : les
      # habitants ont reçu l'ancien module pendant deux versions, avec un
      # bouton visible mais mort. Voir ADR-0019.
      - name: Cache-busting check (?v=)
        run: node scripts/check-cache-bust.js
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
