name: Détection de liens morts

on:
  schedule:
    # Tous les lundis à 07h00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  liens-morts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Vérifier les liens
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Périmètre : les pages HTML ET les modules js/ (pas les libs vendor ni
          # les tests).
          #
          # ⚠️ js/ a été ajouté après coup : le guide d'arrivée annonçait
          # « laposte.fr/reexpedition-courrier » (404) et « valdeloire-fibre.fr »
          # (domaine inexistant) sans que rien ne le détecte, parce que ce
          # scan ne regardait que les .html. Or l'essentiel des liens montrés
          # aux habitants vit désormais dans les modules JS (guide d'arrivée,
          # associations, arbre de décision de MEL…).
          #
          # Deux familles d'exclusions :
          #  - sites qui bloquent les robots (Facebook/Instagram, LinkedIn → 999 ;
          #    claude.ai / chatgpt.com / chat.mistral.ai → 403) ;
          #  - points d'entrée d'API et consoles d'admin, qui ne sont pas des
          #    liens suivis par un humain et répondent 401/404 sans paramètres ;
          #  - laposte.fr et jimdosite.com, qui répondent 403 aux robots alors
          #    que leurs pages s'ouvrent normalement dans un navigateur (vérifié
          #    à la main) — à ne pas confondre avec un lien réellement cassé ;
          #  - logo.clearbit.com et google.com/s2/favicons : URL construites par
          #    concaténation dans mat-entreprises.js, jamais valides hors contexte ;
          #  - les pages d'inscription des hébergeurs citées par le kit de
          #    réplication (Netlify, Cloudflare, GitHub, OVH…) : ce sont des
          #    chaînes de documentation dans mat-partager.js, pas des liens de
          #    l'application, et elles bloquent les robots ;
          #  - legifrance.gouv.fr : refuse les robots (403) alors que l'article
          #    cité comme source par « Le saviez-vous ? » s'ouvre normalement ;
          #  - mairie-nomdeville.fr : adresse d'EXEMPLE dans le texte du kit de
          #    réplication, volontairement fictive.
          #
          # ⛔ NE JAMAIS écrire de commentaire À L'INTÉRIEUR du bloc `args: >-`
          # ci-dessous. Dans un scalaire replié YAML, « # » n'est PAS un
          # commentaire : le texte part tel quel dans la ligne de commande de
          # lychee. C'est arrivé le 2 août 2026 — trois lignes d'explication ont
          # rendu le scan muet (1 s d'exécution, rapport vide) sans rien casser
          # de visible. Les commentaires vont ici, au-dessus de la clé.
          # ⚠️ Concurrence et délai : lychee lance par défaut jusqu'à 128 requêtes
          # en parallèle, et abandonne au bout de 20 s. service-public.gouv.fr —
          # de loin le domaine le plus cité par MEL et par le guide d'arrivée —
          # étrangle cette rafale et laisse expirer une partie des requêtes. Le
          # scan du 24 août 2026 côté backend a ainsi ouvert l'issue #201 sur
          # trois « TIMEOUT » de pages parfaitement vivantes (R11193, R16396).
          # Un faux positif coûte plus cher qu'un scan lent : il faut le
          # ré-instruire à la main, et il apprend à se méfier du signal.
          # 8 requêtes en parallèle et 30 s de patience suffisent — le scan
          # tient largement dans les 10 minutes du job.
          # ⚠️ Un 403 n'est PAS un lien mort : c'est la réponse d'un serveur À UN
          # ROBOT. L'issue #450 portait trois « erreurs » sur quatre de cette
          # nature (chaiamandineetquentin.fr, xpfibre.com/loiret-thd compté deux
          # fois) — trois pages qui s'ouvrent normalement dans un navigateur.
          # La réponse n'est pas d'allonger la liste d'exclusions ci-dessous : un
          # domaine exclu n'est PLUS JAMAIS vérifié, y compris le jour où il meurt
          # pour de bon (valdeloire-fibre.fr, domaine inexistant, a été annoncé aux
          # habitants pendant des mois). L'étape suivante re-teste donc chaque URL
          # signalée avec des en-têtes de navigateur : ce qui répond sort du
          # rapport, ce qui ne répond pas y reste.
          args: >-
            --no-progress
            --max-retries 2
            --max-concurrency 8
            --timeout 30
            --exclude 'facebook\.com'
            --exclude 'instagram\.com'
            --exclude 'linkedin\.com'
            --exclude 'claude\.ai'
            --exclude 'chatgpt\.com'
            --exclude 'chat\.mistral\.ai'
            --exclude 'console\.mistral\.ai'
            --exclude 'dashboard\.render\.com'
            --exclude 'onrender\.com'
            --exclude 'vercel\.com'
            --exclude 'public-api\.meteofrance\.fr'
            --exclude 'api-adresse\.data\.gouv\.fr'
            --exclude 'apicarto\.ign\.fr'
            --exclude 'data\.geopf\.fr'
            --exclude 'cadastre\.data\.gouv\.fr'
            --exclude 'openagenda\.com'
            --exclude 'res\.cloudinary\.com'
            --exclude 'sentry\.io'
            --exclude 'tile\.openstreetmap\.org'
            --exclude 'localhost'
            --exclude 'overpass-api\.de'
            --exclude 'hubeau\.eaufrance\.fr'
            --exclude 'vigieau\.gouv\.fr'
            --exclude 'trello\.com'
            --exclude 'upstash\.io'
            --exclude 'laposte\.fr'
            --exclude 'jimdosite\.com'
            --exclude 'logo\.clearbit\.com'
            --exclude 'google\.com/s2/favicons'
            --exclude 'app\.netlify\.com'
            --exclude 'dash\.cloudflare\.com'
            --exclude 'github\.com/signup'
            --exclude 'ovhcloud\.com'
            --exclude 'donnees\.roulez-eco\.fr'
            --exclude 'legifrance\.gouv\.fr'
            --exclude 'mairie-nomdeville\.fr'
            index.html admin.html architecture.html notif.html offline.html partager.html
            'js/*.js'
          # JSON : le rapport lisible est construit par l'étape suivante, une
          # fois les faux positifs écartés.
          format: json
          output: ./lychee/rapport.json
          fail: false

      # Re-vérification « pour de vrai » : chaque URL que lychee a rejetée est
      # rappelée avec des en-têtes de navigateur. Celles qui répondent sont
      # écartées du rapport (et listées dans un bloc repliable, pour qu'un faux
      # positif reste visible sans faire de bruit) ; les autres y restent.
      # C'est cette étape qui décide, pas le code de sortie de lychee.
      - name: Re-vérifier les liens signalés
        id: verif
        run: node scripts/verifier-liens-signales.js ./lychee/rapport.json ./lychee/rapport.md

      # ⚠️ Sans cette recherche, chaque passage hebdomadaire ouvrait une issue
      # DE PLUS, au lieu de mettre à jour l'existante : #359 et #366 étaient
      # identiques mot pour mot, à un jour d'intervalle. Le rapport de lychee
      # décrit un état courant, pas un événement — une seule issue vivante suffit.
      - name: Chercher une issue « liens-morts » déjà ouverte
        id: issue_ouverte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numero=$(gh issue list --repo "$GITHUB_REPOSITORY" \
                     --label liens-morts --state open --limit 1 \
                     --json number --jq '.[0].number // ""')
          echo "numero=$numero" >> "$GITHUB_OUTPUT"
          echo "Issue liens-morts ouverte : ${numero:-aucune}"

      - name: Créer ou mettre à jour l'issue si des liens sont cassés
        if: steps.verif.outputs.restants != '0'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: 🔗 Liens morts détectés sur le site
          content-filepath: ./lychee/rapport.md
          labels: liens-morts
          # Vide → création. Renseigné → mise à jour de l'issue existante.
          issue-number: ${{ steps.issue_ouverte.outputs.numero }}

      # Symétrique : quand tout repasse au vert, l'issue n'a plus de raison de
      # rester ouverte. Sans ça elle traîne jusqu'à ce que quelqu'un y pense.
      - name: Refermer l'issue si plus aucun lien n'est cassé
        if: steps.verif.outputs.restants == '0' && steps.issue_ouverte.outputs.numero != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMERO: ${{ steps.issue_ouverte.outputs.numero }}
        run: |
          gh issue comment "$NUMERO" --repo "$GITHUB_REPOSITORY" \
            --body "✅ Scan du $(date -u '+%d/%m/%Y') : plus aucun lien cassé. Refermée automatiquement."
          gh issue close "$NUMERO" --repo "$GITHUB_REPOSITORY" --reason completed
