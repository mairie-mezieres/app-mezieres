<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maquette — Mézières en 3D</title>
<link rel="stylesheet" href="./vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="./css/fonts.css">
<style>
:root{
  --forest:#1a3d2b;--leaf:#2d6a4f;--sage:#52b788;--mist:#d8f3dc;
  --gold:#d4a843;--cream:#faf7f2;--warm:#f4f0ea;
  --card:#fff;--text:#1c2b1f;--muted:#5a7065;--border:rgba(0,0,0,0.07);
  --shadow-lg:0 8px 32px rgba(26,61,43,0.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Nunito',system-ui,sans-serif;color:var(--text);background:var(--warm);overflow:hidden}
#map{position:absolute;inset:0}

/* ── Bandeau ─────────────────────────────────────────── */
.bar{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;
  background:linear-gradient(180deg,rgba(26,61,43,.92),rgba(26,61,43,.72) 70%,transparent);color:#fff}
.bar h1{font-size:1rem;font-weight:900;letter-spacing:.01em;line-height:1.15}
.bar .sub{font-size:.66rem;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.08em}
.bar .maq{margin-left:auto;background:var(--gold);color:#3a2c05;font-size:.6rem;font-weight:900;
  padding:4px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}

/* ── Boutons de couches ──────────────────────────────── */
.tools{position:absolute;z-index:5;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.tbtn{appearance:none;border:1px solid var(--border);background:rgba(255,255,255,.94);color:var(--text);
  font-family:inherit;font-size:.74rem;font-weight:800;padding:8px 12px;border-radius:999px;
  box-shadow:var(--shadow-lg);cursor:pointer;display:flex;align-items:center;gap:7px;backdrop-filter:blur(6px)}
.tbtn[aria-pressed="true"]{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.tbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ── Légende ─────────────────────────────────────────── */
.legend{position:absolute;z-index:5;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  background:rgba(255,255,255,.94);border-radius:14px;box-shadow:var(--shadow-lg);
  max-width:min(46vw,230px);backdrop-filter:blur(6px);display:none;overflow:hidden}
.legend.on{display:block}
.legend summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:.62rem;font-weight:900;
  text-transform:uppercase;letter-spacing:.07em;color:var(--leaf);display:flex;align-items:center;gap:6px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:'▾';margin-left:auto;transition:transform .2s}
.legend[open] summary::after{transform:rotate(180deg)}
.legend summary:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.legend ul{list-style:none;display:grid;gap:4px;padding:0 12px 11px}
.legend li{display:flex;align-items:center;gap:7px;font-size:.68rem;font-weight:800;line-height:1.2}
.legend i{width:12px;height:12px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.15)}
.legend li span span{color:var(--muted);font-weight:600}
@media (max-width:520px){ .legend li span span{display:none} }

/* ── Fiche ───────────────────────────────────────────── */
.sheet{position:absolute;z-index:6;left:0;right:0;bottom:0;background:var(--card);
  border-radius:20px 20px 0 0;box-shadow:0 -8px 32px rgba(26,61,43,.22);
  transform:translateY(102%);transition:transform .28s ease;max-height:76%;display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-hd{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.sheet-hd .z{background:var(--mist);color:var(--leaf);font-weight:900;font-size:.78rem;padding:5px 11px;border-radius:999px;flex:0 0 auto}
.sheet-hd .t{font-size:.86rem;font-weight:900;line-height:1.3}
.sheet-hd .t small{display:block;font-size:.7rem;font-weight:700;color:var(--muted);margin-top:2px}
.sheet-x{margin-left:auto;appearance:none;border:0;background:var(--warm);width:32px;height:32px;border-radius:50%;
  font-size:1rem;cursor:pointer;flex:0 0 auto;color:var(--text)}
.sheet-bd{padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:.76rem;margin-bottom:14px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{font-weight:800;text-align:right;text-wrap:pretty}
.sec{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--leaf);font-weight:900;margin:14px 0 7px}
.rows{display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;gap:9px;background:var(--warm);border-radius:10px;padding:8px 10px;font-size:.74rem}
.row .c{flex:1;font-weight:700;line-height:1.3}
.row .a{font-weight:900;font-size:.68rem;padding:3px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.a.ok{background:#d8f3dc;color:#1b5e3f}.a.dp{background:#fdf0d5;color:#8a6a12}.a.pc{background:#fde2e1;color:#a02c26}
.warn{background:#fdf0d5;border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:8px 11px;font-size:.72rem;font-weight:700;line-height:1.45}

/* ── Bandeau d'état ──────────────────────────────────── */
.status{position:absolute;z-index:7;left:50%;transform:translateX(-50%);
  top:calc(env(safe-area-inset-top,0px) + 58px);background:rgba(28,43,31,.93);color:#fff;
  font-size:.7rem;font-weight:700;padding:8px 14px;border:0;font-family:inherit;cursor:pointer;border-radius:999px;max-width:88vw;text-align:center;
  line-height:1.35;box-shadow:var(--shadow-lg)}
.status.done{display:none}
.status b{color:var(--gold)}
.maplibregl-ctrl-attrib{font-size:9px}
</style>
</head>
<body>

<div id="map" role="application" aria-label="Vue 3D de Mézières-lez-Cléry"></div>

<header class="bar">
  <div>
    <div class="sub">Mézières-lez-Cléry</div>
    <h1>Le village en 3D</h1>
  </div>
  <span class="maq">Maquette</span>
</header>

<button class="status" id="status" title="Masquer">Chargement…</button>

<div class="tools">
  <button class="tbtn" id="btn-zones" aria-pressed="true">🗺️ <span>Zonage du PLU</span></button>
  <button class="tbtn" id="btn-bati" aria-pressed="true">🏠 <span>Bâtiments 3D</span></button>
  <button class="tbtn" id="btn-fond" aria-pressed="true">🛰️ <span>Vue aérienne</span></button>
  <button class="tbtn" id="btn-diag" hidden>🔎 <span>Détail des sources</span></button>
</div>

<details class="legend on" id="legend">
  <summary>Zones du PLU</summary>
  <ul id="legend-list"></ul>
</details>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="sheet-hd">
    <span class="z" id="sh-zone">—</span>
    <div class="t" id="sh-title">—<small id="sh-sub"></small></div>
    <button class="sheet-x" id="sh-close" aria-label="Fermer">✕</button>
  </div>
  <div class="sheet-bd" id="sh-body"></div>
</section>

<script src="./vendor/maplibre/maplibre-gl.js"></script>
<script>
/* ════════════════════════════════════════════════════════════════════
   MAQUETTE « Mézières en 3D » — page d'essai, hors application.
   Non référencée par index.html, absente du précache du service worker.

   Sources (interrogées depuis le navigateur de l'utilisateur) :
     • Fond   : orthophoto IGN — data.geopf.fr (couches ouvertes, sans clé)
     • Bâti   : BD TOPO IGN via WFS, attribut `hauteur` ; repli OpenStreetMap
     • Zonage : Géoportail de l'Urbanisme via apicarto (INSEE 45203)
     • Règles : ./data/plu-data.json — le fichier déjà embarqué dans l'app
   ════════════════════════════════════════════════════════════════════ */

var CENTRE = [1.8080, 47.8220];      // lon, lat — Mézières-lez-Cléry
var INSEE  = '45203';
var BBOX   = { w: 1.762, s: 47.792, e: 1.856, n: 47.852 };

/* Couleurs des 13 zones du PLU communal. */
var COULEURS = {
  'Ua':'#c0563f', 'Ub':'#e08a3c', 'Ub1':'#eeb15e', 'Ue':'#8e6bb5', 'Ui':'#7c8a91',
  '1AU':'#e2703a', '2AU':'#b4552b', 'A':'#e8c547', 'Ah':'#d9b44a',
  'N':'#2f9e5f', 'Nh':'#63c187', 'Nj':'#a3d9b1', 'Nl':'#8fcfae'
};
var DEFAUT = '#9aa5a0';

var PLU = null;          // contenu de data/plu-data.json
var ZONES = null;        // FeatureCollection des zones (ou null)
var etat = { zones:false, bati:false, mode:'reel' };

function statut(html, fini){
  var el = document.getElementById('status');
  el.innerHTML = html;
  el.classList.toggle('done', !!fini);
}
/* Le bandeau d'état porte l'avertissement « données simulées » : on ne le
   masque jamais tout seul en mode démonstration, mais on peut le fermer. */
document.getElementById('status').onclick = function(){ this.classList.add('done'); };

/* ── Carte ─────────────────────────────────────────────────────── */
var ortho = 'https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile'
          + '&LAYER=ORTHOIMAGERY.ORTHOPHOTOS&STYLE=normal&TILEMATRIXSET=PM'
          + '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/jpeg';
var plan  = 'https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile'
          + '&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&STYLE=normal&TILEMATRIXSET=PM'
          + '&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/png';

var map = new maplibregl.Map({
  container: 'map',
  center: CENTRE,
  zoom: 15.0, pitch: 62, bearing: -18,
  maxPitch: 80,
  attributionControl: { compact: true },
  style: {
    version: 8,
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sources: {
      ortho: { type:'raster', tiles:[ortho], tileSize:256, maxzoom:19,
               attribution:'© IGN — Géoplateforme' },
      plan:  { type:'raster', tiles:[plan],  tileSize:256, maxzoom:19,
               attribution:'© IGN' }
    },
    layers: [
      { id:'ciel', type:'background', paint:{ 'background-color':'#cfe3d6' } },
      { id:'l-plan',  type:'raster', source:'plan',  layout:{ visibility:'none' } },
      { id:'l-ortho', type:'raster', source:'ortho' }
    ]
  }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch:true }), 'top-right');
map.touchZoomRotate.enableRotation();

/* ── Géométrie : point dans polygone (sans dépendance) ─────────── */
function dansAnneau(pt, anneau){
  var x = pt[0], y = pt[1], dedans = false;
  for (var i = 0, j = anneau.length - 1; i < anneau.length; j = i++){
    var xi = anneau[i][0], yi = anneau[i][1], xj = anneau[j][0], yj = anneau[j][1];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) dedans = !dedans;
  }
  return dedans;
}
function dansGeom(pt, geom){
  if (!geom) return false;
  var polys = geom.type === 'Polygon' ? [geom.coordinates]
            : geom.type === 'MultiPolygon' ? geom.coordinates : [];
  for (var p = 0; p < polys.length; p++){
    var anneaux = polys[p];
    if (!anneaux.length || !dansAnneau(pt, anneaux[0])) continue;
    var trou = false;
    for (var t = 1; t < anneaux.length; t++) if (dansAnneau(pt, anneaux[t])) { trou = true; break; }
    if (!trou) return true;
  }
  return false;
}

/* ── Chargement des règles du PLU (fichier déjà dans l'app) ─────── */
function chargerRegles(){
  return fetch('./data/plu-data.json')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ PLU = j; })
    .catch(function(){ PLU = null; });
}

/* ── Zonage : Géoportail de l'Urbanisme via apicarto ─────────────
   ⚠️ `zone-urba` n'accepte PAS de paramètre `insee` — la première version
   de cette maquette l'interrogeait ainsi, la requête partait en erreur et
   le `.catch()` l'avalait en silence : ni zonage, ni légende, ni message.
   L'appel attend une **partition** (`DU_45203`) ou une **géométrie**.

   On procède donc en trois temps, du plus sûr au plus tolérant, et on
   retient le motif d'échec de chaque étape pour pouvoir l'afficher —
   « PLU non publié » et « ma requête était mauvaise » ne se soignent pas
   de la même façon. */
var GPU = 'https://apicarto.ign.fr/api/gpu/';
var zonesDiag = '';        // motif lisible en cas d'échec

function _gpuFetch(url){
  return fetch(url).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

/* Étape 1 — la commune a-t-elle un document d'urbanisme, et lequel ? */
function _gpuPartition(){
  return _gpuFetch(GPU + 'municipality?insee=' + INSEE)
    .then(function(fc){
      var p = fc && fc.features && fc.features[0] && fc.features[0].properties;
      if (!p) { zonesDiag = 'commune absente du Géoportail de l\'Urbanisme'; return null; }
      if (p.is_rnu === true || p.is_rnu === 'true'){
        zonesDiag = 'commune au RNU — pas de document d\'urbanisme opposable';
        return null;
      }
      return p.partition || null;
    })
    .catch(function(e){ zonesDiag = 'appel « municipality » : ' + e.message; return null; });
}

/* Étape 2 et 3 — les zones, par partition puis par emprise géographique. */
function _gpuZones(partition){
  if (partition) return _gpuFetch(GPU + 'zone-urba?partition=' + encodeURIComponent(partition));
  var geom = { type:'Polygon', coordinates:[[
    [BBOX.w, BBOX.s], [BBOX.e, BBOX.s], [BBOX.e, BBOX.n], [BBOX.w, BBOX.n], [BBOX.w, BBOX.s]
  ]]};
  return _gpuFetch(GPU + 'zone-urba?geom=' + encodeURIComponent(JSON.stringify(geom)));
}

function chargerZones(){
  return _gpuPartition()
    .then(function(partition){
      return _gpuZones(partition)
        .catch(function(e){
          /* Une partition qui échoue mérite une seconde chance par géométrie. */
          if (!partition) throw e;
          return _gpuZones(null);
        });
    })
    .then(function(fc){
      if (!fc || !fc.features || !fc.features.length){
        zonesDiag = zonesDiag || 'aucune zone renvoyée pour cette commune';
        throw new Error(zonesDiag);
      }
      fc.features.forEach(function(f){
        var p = f.properties || {};
        f.properties.mat_code = normaliserZone(p.libelle || p.typezone || '');
      });
      ZONES = fc;
      zonesDiag = '';
      return true;
    })
    .catch(function(e){
      ZONES = null;
      zonesDiag = zonesDiag || (e && e.message) || 'raison inconnue';
      return false;
    });
}

/* Le libellé du GPU (« UA », « Ub1 », « 1AUb »…) doit retomber sur une des
   13 zones décrites dans data/plu-data.json. On teste du plus précis au
   plus général, sinon on garde la zone telle quelle pour l'affichage. */
function normaliserZone(lib){
  if (!lib) return '';
  var v = String(lib).trim();
  var cles = PLU && PLU.zones ? Object.keys(PLU.zones) : Object.keys(COULEURS);
  cles.sort(function(a,b){ return b.length - a.length; });
  for (var i = 0; i < cles.length; i++){
    if (v.toLowerCase() === cles[i].toLowerCase()) return cles[i];
  }
  for (var k = 0; k < cles.length; k++){
    if (v.toLowerCase().indexOf(cles[k].toLowerCase()) === 0) return cles[k];
  }
  return v;
}

/* ── Bâti : BD TOPO IGN (hauteurs réelles), repli OpenStreetMap ───
   Le premier essai unique ne disait jamais POURQUOI il échouait : on
   tombait directement sur le bâti simulé, posé sur une vraie photo. On
   tente désormais plusieurs formulations de la requête, et chaque essai
   consigne son résultat exact dans `journal`, consultable à l'écran. */
var journal = [];        // [{nom, ok, detail, n}]

function noter(nom, ok, detail, n){
  journal.push({ nom:nom, ok:!!ok, detail:detail || '', n:n || 0 });
}

/* Un serveur OGC renvoie ses erreurs en XML, pas en JSON : sans lire ce
   corps, on perd la seule phrase qui explique le refus. */
function _lireErreur(r){
  return r.text().then(function(t){
    var m = t.match(/<(?:ows:)?ExceptionText[^>]*>([\s\S]*?)<\//i);
    return 'HTTP ' + r.status + (m ? ' — ' + m[1].trim().slice(0, 160) : '');
  }).catch(function(){ return 'HTTP ' + r.status; });
}

function _wfs(nom, url){
  return fetch(url).then(function(r){
    if (!r.ok) return _lireErreur(r).then(function(d){ throw new Error(d); });
    return r.json();
  }).then(function(fc){
    if (!fc || !fc.features || !fc.features.length) throw new Error('réponse vide');
    noter(nom, true, 'ok', fc.features.length);
    return fc;
  }).catch(function(e){
    noter(nom, false, e.message);
    throw e;
  });
}

/* Trois formulations, de la plus sûre à la plus ancienne.
   CRS:84 impose l'ordre longitude,latitude — sans ambiguïté. WFS 2.0 avec
   EPSG:4326 impose au contraire latitude,longitude, d'où la bascule de
   l'ordre du BBOX entre les deux variantes. */
function chargerBatiIGN(){
  var base = 'https://data.geopf.fr/wfs/ows?SERVICE=WFS&REQUEST=GetFeature'
           + '&outputFormat=application/json';
  var essais = [
    ['IGN BD TOPO (CRS:84)',
      base + '&VERSION=2.0.0&TYPENAMES=BDTOPO_V3:batiment&SRSNAME=CRS:84&count=6000'
           + '&BBOX=' + [BBOX.w, BBOX.s, BBOX.e, BBOX.n].join(',') + ',CRS:84'],
    ['IGN BD TOPO (EPSG:4326)',
      base + '&VERSION=2.0.0&TYPENAMES=BDTOPO_V3:batiment&SRSNAME=EPSG:4326&count=6000'
           + '&BBOX=' + [BBOX.s, BBOX.w, BBOX.n, BBOX.e].join(',') + ',EPSG:4326'],
    ['IGN BD TOPO (WFS 1.1)',
      base + '&VERSION=1.1.0&TYPENAME=BDTOPO_V3:batiment&SRSNAME=EPSG:4326&maxFeatures=6000'
           + '&BBOX=' + [BBOX.s, BBOX.w, BBOX.n, BBOX.e].join(',')]
  ];
  var chaine = Promise.reject(new Error('init'));
  essais.forEach(function(e){
    chaine = chaine.catch(function(){ return _wfs(e[0], e[1]); });
  });
  return chaine.then(function(fc){
    fc.features.forEach(function(f){
      var p = f.properties || {};
      var h = parseFloat(p.hauteur);
      if (!isFinite(h) || h <= 0){
        var et = parseFloat(p.nombre_d_etages != null ? p.nombre_d_etages : p.nombre_etages);
        h = isFinite(et) && et > 0 ? (et * 2.8 + 1.2) : 6;
      }
      f.properties.mat_h = Math.max(2.5, Math.min(h, 40));
      f.properties.mat_src = 'IGN';
    });
    return fc;
  });
}

function chargerBatiOSM(){
  var q = '[out:json][timeout:25];(way["building"](' + [BBOX.s,BBOX.w,BBOX.n,BBOX.e].join(',') + '););out geom;';
  return fetch('https://overpass-api.de/api/interpreter', {
    method:'POST', body:'data=' + encodeURIComponent(q),
    headers:{ 'Content-Type':'application/x-www-form-urlencoded' }
  })
  .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(j){
    var feats = (j.elements || []).filter(function(e){ return e.geometry && e.geometry.length > 3; })
      .map(function(e){
        var t = e.tags || {};
        var h = parseFloat(t.height);
        if (!isFinite(h) || h <= 0){
          var n = parseFloat(t['building:levels']);
          h = isFinite(n) && n > 0 ? (n * 2.8 + 1.2) : 6;
        }
        return {
          type:'Feature',
          properties:{ mat_h: Math.max(2.5, Math.min(h, 40)), mat_src:'OSM' },
          geometry:{ type:'Polygon', coordinates:[ e.geometry.map(function(g){ return [g.lon, g.lat]; }) ] }
        };
      });
    if (!feats.length) throw new Error('réponse vide');
    noter('OpenStreetMap (Overpass)', true, 'ok', feats.length);
    return { type:'FeatureCollection', features:feats };
  })
  .catch(function(e){ noter('OpenStreetMap (Overpass)', false, e.message); throw e; });
}

/* Contrôle de position : Mézières est à lon ≈ 1,81 / lat ≈ 47,82. Des
   valeurs hors de cette fenêtre signent soit une inversion des axes
   (lon ≈ 47,8), soit une projection non convertie (Lambert-93, 6 chiffres). */
function auditGeom(fc){
  var minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
  function pt(c){
    if (typeof c[0] === 'number'){
      minX = Math.min(minX, c[0]); maxX = Math.max(maxX, c[0]);
      minY = Math.min(minY, c[1]); maxY = Math.max(maxY, c[1]);
    } else { c.forEach(pt); }
  }
  fc.features.forEach(function(f){ if (f.geometry) pt(f.geometry.coordinates); });
  var a = { minX:minX, maxX:maxX, minY:minY, maxY:maxY, souci:'' };
  if (Math.abs(maxX) > 180 || Math.abs(maxY) > 90) a.souci = 'projection non convertie (Lambert-93 ?)';
  else if (minX > 40 && maxY < 10)                 a.souci = 'axes inversés (latitude en premier)';
  else if (maxX < BBOX.w - 0.05 || minX > BBOX.e + 0.05 ||
           maxY < BBOX.s - 0.05 || minY > BBOX.n + 0.05) a.souci = 'emprise hors commune';
  return a;
}

/* Inversion détectée : on remet les couples dans l'ordre GeoJSON. */
function inverserAxes(fc){
  function inv(c){
    if (typeof c[0] === 'number') return [c[1], c[0]];
    return c.map(inv);
  }
  fc.features.forEach(function(f){
    if (f.geometry) f.geometry.coordinates = inv(f.geometry.coordinates);
  });
  return fc;
}

/* ── Mode démonstration ─────────────────────────────────────────
   Aucune source n'a répondu (réseau coupé, IGN en panne, ou ?demo=1).
   On dessine un village fictif — bâti aligné sur des rues et zonage
   concentrique — pour que la COMPOSITION reste jugeable. Ce n'est pas
   Mézières, et le bandeau d'état le dit en toutes lettres. */
var _rnd = 987654321;
function alea(){ _rnd = (_rnd * 1103515245 + 12345) % 2147483648; return _rnd / 2147483648; }

/* Ellipse en GeoJSON — la latitude est resserrée pour compenser la
   projection (à 47,8° de latitude, 1° de longitude vaut ~0,67° de lat). */
function ellipse(dLon, dLat, decLon, decLat, n){
  var pts = [];
  for (var i = 0; i <= (n || 48); i++){
    var a = (i / (n || 48)) * Math.PI * 2;
    pts.push([
      CENTRE[0] + decLon + Math.cos(a) * dLon * (1 + (alea() - .5) * .16),
      CENTRE[1] + decLat + Math.sin(a) * dLat * (1 + (alea() - .5) * .16)
    ]);
  }
  pts[pts.length - 1] = pts[0];
  return { type:'Polygon', coordinates:[pts] };
}

/* Ordre volontaire : les grandes zones d'abord (dessinées dessous),
   les petites ensuite (dessinées dessus). La recherche du zonage sous
   un point parcourt le tableau à l'envers, donc la plus petite gagne. */
function zonesDemo(){
  var def = [
    ['A',   0.0230, 0.0150,  0.0000,  0.0000],
    ['N',   0.0150, 0.0075, -0.0070, -0.0090],
    ['Nj',  0.0038, 0.0022,  0.0080, -0.0038],
    ['1AU', 0.0042, 0.0026, -0.0075,  0.0040],
    ['2AU', 0.0032, 0.0020,  0.0092,  0.0052],
    ['Ub',  0.0105, 0.0068,  0.0000,  0.0000],
    ['Ui',  0.0036, 0.0022,  0.0105, -0.0006],
    ['Ue',  0.0030, 0.0019, -0.0044, -0.0032],
    ['Ub1', 0.0034, 0.0021,  0.0058,  0.0032],
    ['Ua',  0.0048, 0.0031,  0.0000,  0.0000]
  ];
  return {
    type:'FeatureCollection',
    features: def.map(function(d){
      return { type:'Feature',
               properties:{ mat_code:d[0], libelle:d[0], mat_demo:true },
               geometry: ellipse(d[1], d[2], d[3], d[4]) };
    })
  };
}

/* Bâti aligné le long de rues : une trame de voies rayonnantes et de
   ceintures, densité et hauteur décroissantes vers l'extérieur. */
function batiDemo(){
  var feats = [];
  function maison(lon, lat, larg, prof, rot, h){
    var c = Math.cos(rot), s = Math.sin(rot), k = 0.67;   // aplatissement lat
    var pts = [[-larg,-prof],[larg,-prof],[larg,prof],[-larg,prof]].map(function(p){
      return [ lon + (p[0] * c - p[1] * s), lat + (p[0] * s + p[1] * c) * k ];
    });
    pts.push(pts[0]);
    feats.push({ type:'Feature',
      properties:{ mat_h: h, mat_src:'DEMO' },
      geometry:{ type:'Polygon', coordinates:[pts] } });
  }
  var RUES = 9;
  for (var r = 0; r < RUES; r++){
    var cap = (r / RUES) * Math.PI * 2 + alea() * .12;
    var pas = 0.00052;
    for (var d = 0.0011; d < 0.0135; d += pas){
      if (alea() < 0.16) continue;                       // trous : jardins, croisements
      var densite = 1 - (d / 0.0145);
      if (alea() > 0.30 + densite * 0.72) continue;
      for (var cote = -1; cote <= 1; cote += 2){
        if (alea() < 0.22) continue;
        var ecart = 0.00034 * cote;
        var lon = CENTRE[0] + Math.cos(cap) * d - Math.sin(cap) * ecart;
        var lat = CENTRE[1] + (Math.sin(cap) * d + Math.cos(cap) * ecart) * 0.67;
        var etages = d < 0.0035 ? (alea() < .45 ? 2 : 1) : (alea() < .12 ? 2 : 1);
        maison(lon, lat,
               0.000085 + alea() * 0.00007,
               0.000060 + alea() * 0.00005,
               cap + (alea() - .5) * .18,
               etages * 2.8 + 1.4 + alea() * 1.2);
      }
    }
  }
  /* Deux bâtiments repères : mairie et église, plus hauts. */
  maison(CENTRE[0] - 0.00042, CENTRE[1] + 0.00021, 0.00021, 0.00013, 0.35, 11);
  maison(CENTRE[0] + 0.00055, CENTRE[1] - 0.00025, 0.00013, 0.00013, 0.35, 19);
  return { type:'FeatureCollection', features:feats };
}

/* ── Mise en place des couches ─────────────────────────────────── */
function poserZones(){
  if (!ZONES) return;
  window.__diag = window.__diag || {};
  window.__diag.zones = ZONES.features.length;
  map.addSource('zones', { type:'geojson', data:ZONES });
  var couleur = ['match', ['get','mat_code']];
  Object.keys(COULEURS).forEach(function(k){ couleur.push(k, COULEURS[k]); });
  couleur.push(DEFAUT);
  /* Le zonage se glisse SOUS le bâti quand celui-ci existe — mais il peut
     désormais ne jamais arriver (source indisponible). `beforeId` doit donc
     rester facultatif, sinon MapLibre lève « layer 'bati' does not exist ». */
  var sous = map.getLayer('bati') ? 'bati' : undefined;
  map.addLayer({ id:'zones-fill', type:'fill', source:'zones',
    paint:{ 'fill-color':couleur, 'fill-opacity':0.42 } }, sous);
  map.addLayer({ id:'zones-line', type:'line', source:'zones',
    paint:{ 'line-color':couleur, 'line-width':1.6, 'line-opacity':0.9 } }, sous);
  etat.zones = true;
}

function poserBati(fc){
  /* Exposé pour les captures et un futur test Playwright. */
  window.__diag = window.__diag || {};
  window.__diag.bati = fc.features.length;
  window.__diag.src  = fc.features[0] && fc.features[0].properties.mat_src;
  map.addSource('bati', { type:'geojson', data:fc });
  map.addLayer({
    id:'bati', type:'fill-extrusion', source:'bati',
    paint:{
      'fill-extrusion-color':[
        'interpolate',['linear'],['get','mat_h'],
        3,'#f2ede4', 8,'#e4d9c8', 14,'#cbb79b', 25,'#a8906f'
      ],
      'fill-extrusion-height':['get','mat_h'],
      'fill-extrusion-base':0,
      'fill-extrusion-opacity':0.94,
      'fill-extrusion-vertical-gradient':true
    }
  });
  map.addLayer({
    id:'bati-sel', type:'fill-extrusion', source:'bati',
    filter:['==','mat_id',''],
    paint:{ 'fill-extrusion-color':'#d4a843', 'fill-extrusion-height':['+',['get','mat_h'],1.2],
            'fill-extrusion-base':0, 'fill-extrusion-opacity':1 }
  });
  etat.bati = true;
}

function poserLegende(){
  var ul = document.getElementById('legend-list');
  var vues = {};
  if (ZONES) ZONES.features.forEach(function(f){ vues[f.properties.mat_code] = true; });
  var cles = Object.keys(COULEURS).filter(function(k){ return !ZONES || vues[k]; });
  if (!cles.length) cles = Object.keys(COULEURS);
  ul.innerHTML = cles.map(function(k){
    var lib = PLU && PLU.zones && PLU.zones[k] ? PLU.zones[k].label.split('–')[1] : '';
    return '<li><i style="background:' + COULEURS[k] + '"></i><span>' + k
         + (lib ? ' <span style="color:#5a7065;font-weight:600">' + lib.trim() + '</span>' : '')
         + '</span></li>';
  }).join('');
}

/* ── Fiche « ce que vous avez le droit de construire » ──────────── */
var CLASSES = { 'Aucune formalité':'ok', 'Déclaration Préalable':'dp', 'Permis de Construire':'pc' };
function classeAuth(a){
  var s = String(a || '');
  if (/aucune formalit/i.test(s)) return 'ok';
  if (/permis de construire/i.test(s)) return 'pc';
  return 'dp';
}

function ouvrirFiche(code, h, src){
  var z = PLU && PLU.zones ? PLU.zones[code] : null;
  document.getElementById('sh-zone').textContent = code || '?';
  document.getElementById('sh-title').firstChild.nodeValue =
    z ? z.label.split('–').slice(1).join('–').trim() : 'Zone non déterminée';
  document.getElementById('sh-sub').textContent =
    'Bâtiment de ' + h.toFixed(1) + ' m' + (src === 'IGN' ? ' · hauteur BD TOPO IGN'
      : src === 'OSM' ? ' · hauteur OpenStreetMap' : ' · hauteur simulée');

  var out = '';
  if (z){
    out += '<dl class="kv">'
        +  '<dt>Emprise au sol</dt><dd>' + esc(z.emprise) + '</dd>'
        +  '<dt>Hauteur maximale</dt><dd>' + esc(z.hauteur_principale) + '</dd>'
        +  '<dt>Recul sur voie</dt><dd>' + esc(z.recul_voie_principale) + '</dd>'
        +  '<dt>Clôtures</dt><dd>' + esc(z.cloture_voie) + '</dd>'
        +  '</dl>';
    if (z.description) out += '<div class="warn">' + esc(z.description) + '</div>';
  } else {
    out += '<div class="warn">Le zonage n\'a pas pu être chargé pour ce point. '
        +  'Les règles ci-dessous restent celles du PLU communal, toutes zones confondues.</div>';
  }

  if (PLU && PLU.autorisations){
    ['abri','piscine','cloture','extension','panneaux_solaires'].forEach(function(k){
      var a = PLU.autorisations[k];
      if (!a || !a.tableau) return;
      out += '<div class="sec">' + esc(a.label || etiquette(k)) + '</div><div class="rows">';
      a.tableau.forEach(function(l){
        out += '<div class="row"><span class="c">' + esc(l.cas) + '</span>'
            +  '<span class="a ' + classeAuth(l.auth) + '">' + esc(abrege(l.auth)) + '</span></div>';
      });
      out += '</div>';
      if (a.note) out += '<div class="warn" style="margin-top:7px">' + esc(a.note) + '</div>';
    });
  }
  out += '<div class="sec">Rappel</div><div class="warn">Maquette d\'essai. '
      +  'Seul le service urbanisme de la mairie fait foi — ces éléments ne valent pas autorisation.</div>';

  document.getElementById('sh-body').innerHTML = out;
  document.getElementById('sheet').classList.add('on');
}
function etiquette(k){
  return { abri:'Abri de jardin', piscine:'Piscine', cloture:'Clôture',
           extension:'Extension', panneaux_solaires:'Panneaux solaires' }[k] || k;
}
function abrege(a){
  var s = String(a || '');
  if (/aucune formalit/i.test(s)) return 'Rien à faire';
  if (/permis de construire/i.test(s)) return 'Permis';
  if (/d[ée]claration/i.test(s)) return 'Déclaration';
  return s.length > 22 ? s.slice(0, 21) + '…' : s;
}
function esc(s){
  return String(s == null ? '—' : s).replace(/[&<>"]/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
  });
}

/* ── Panneau de diagnostic ───────────────────────────────────────
   Chaque source interrogée, dans l'ordre, avec le motif exact de son
   refus. C'est ce qui manquait : la maquette basculait sur un bâti
   simulé sans jamais dire pourquoi. */
function ouvrirDiagnostic(){
  document.getElementById('sh-zone').textContent = '🔎';
  document.getElementById('sh-title').firstChild.nodeValue = 'Détail des sources';
  document.getElementById('sh-sub').textContent = 'Ce que chaque service a répondu';

  var out = '<div class="sec">Bâtiments</div><div class="rows">';
  if (!journal.length){
    out += '<div class="row"><span class="c">Aucune source interrogée</span></div>';
  }
  journal.forEach(function(e){
    out += '<div class="row"><span class="c">' + esc(e.nom)
        +  '<br><span style="font-weight:600;color:var(--muted)">' + esc(e.detail) + '</span></span>'
        +  '<span class="a ' + (e.ok ? 'ok' : 'pc') + '">'
        +  (e.ok ? e.n + ' bâtiments' : 'échec') + '</span></div>';
  });
  out += '</div>';

  var a = window.__audit;
  if (a){
    out += '<div class="sec">Position des bâtiments reçus</div>'
        +  '<dl class="kv">'
        +  '<dt>Longitudes</dt><dd>' + a.minX.toFixed(4) + ' → ' + a.maxX.toFixed(4) + '</dd>'
        +  '<dt>Latitudes</dt><dd>' + a.minY.toFixed(4) + ' → ' + a.maxY.toFixed(4) + '</dd>'
        +  '<dt>Attendu</dt><dd>lon ' + BBOX.w + ' → ' + BBOX.e + ' · lat ' + BBOX.s + ' → ' + BBOX.n + '</dd>'
        +  '</dl>';
    out += '<div class="warn">' + (a.souci ? '⚠️ ' + esc(a.souci) : '✅ Emprise cohérente avec la commune.') + '</div>';
  }

  out += '<div class="sec">Zonage du PLU</div><div class="rows"><div class="row">'
      +  '<span class="c">Géoportail de l\'Urbanisme'
      +  (ZONES ? '' : '<br><span style="font-weight:600;color:var(--muted)">' + esc(zonesDiag) + '</span>')
      +  '</span><span class="a ' + (ZONES ? 'ok' : 'pc') + '">'
      +  (ZONES ? ZONES.features.length + ' zones' : 'échec') + '</span></div></div>';

  document.getElementById('sh-body').innerHTML = out;
  document.getElementById('sheet').classList.add('on');
}
document.getElementById('btn-diag').onclick = ouvrirDiagnostic;

document.getElementById('sh-close').onclick = function(){
  document.getElementById('sheet').classList.remove('on');
  if (map.getLayer('bati-sel')) map.setFilter('bati-sel', ['==','mat_id','']);
};

/* ── Interactions ──────────────────────────────────────────────── */
map.on('click', function(e){
  if (!etat.bati) return;
  var f = map.queryRenderedFeatures(e.point, { layers:['bati'] })[0];
  if (!f) return;
  var pt = [e.lngLat.lng, e.lngLat.lat];
  /* Parcours à l'envers : les zones les plus petites sont ajoutées en
     dernier, donc dessinées au-dessus — c'est celle-là qu'il faut lire. */
  var code = '';
  if (ZONES){
    for (var i = ZONES.features.length - 1; i >= 0; i--){
      if (dansGeom(pt, ZONES.features[i].geometry)){ code = ZONES.features[i].properties.mat_code; break; }
    }
  }
  ouvrirFiche(code, Number(f.properties.mat_h) || 6, f.properties.mat_src);
});
map.on('mouseenter', 'bati', function(){ map.getCanvas().style.cursor = 'pointer'; });
map.on('mouseleave', 'bati', function(){ map.getCanvas().style.cursor = ''; });

function bascule(btn, fn){
  var b = document.getElementById(btn);
  b.onclick = function(){
    var on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on));
    fn(on);
  };
}
bascule('btn-zones', function(on){
  ['zones-fill','zones-line'].forEach(function(l){
    if (map.getLayer(l)) map.setLayoutProperty(l, 'visibility', on ? 'visible' : 'none');
  });
  document.getElementById('legend').classList.toggle('on', on && !!ZONES);
});
bascule('btn-bati', function(on){
  ['bati','bati-sel'].forEach(function(l){
    if (map.getLayer(l)) map.setLayoutProperty(l, 'visibility', on ? 'visible' : 'none');
  });
});
bascule('btn-fond', function(on){
  map.setLayoutProperty('l-ortho', 'visibility', on ? 'visible' : 'none');
  map.setLayoutProperty('l-plan',  'visibility', on ? 'none' : 'visible');
  document.querySelector('#btn-fond span').textContent = on ? 'Vue aérienne' : 'Plan';
});

/* ── Démarrage ─────────────────────────────────────────────────── */
/* ?demo=1 — force le mode démonstration, sans aucun appel réseau sortant.
   Utile pour montrer la maquette là où le réseau n'est pas sûr. */
var FORCE_DEMO = /[?&]demo=1/.test(location.search);

map.on('load', function(){
  statut('Chargement des données de l\'IGN…');
  if (FORCE_DEMO){
    etat.mode = 'demo';
    chargerRegles().then(function(){
      ZONES = zonesDemo();
      poserBati(batiDemo());
      poserZones();
      poserLegende();
      statut('⚠️ <b>Mode démonstration</b> — village et zonage simulés, aucune donnée IGN. '
           + 'Le moteur 3D, l\'interface et les règles du PLU sont réels.');
    });
    return;
  }
  chargerRegles()
    .then(chargerZones)
    .then(function(okZones){
      return chargerBatiIGN()
        .catch(function(){ statut('BD TOPO indisponible — repli OpenStreetMap…'); return chargerBatiOSM(); })
        /* ⚠️ Plus de repli sur le bâti simulé ici. Poser un village fictif
           par-dessus une vraie photo aérienne et un vrai zonage ne dégrade
           pas l'affichage : il le rend faux, et rien ne le distingue à l'œil
           d'une donnée exacte. Mieux vaut aucun bâtiment, et le dire. */
        .catch(function(){ return null; })
        .then(function(fc){
          poserZones();
          poserLegende();
          if (!fc){
            statut('<b>Aucun bâtiment chargé</b> — ni l\'IGN ni OpenStreetMap n\'ont répondu.'
                 + (okZones ? ' Le zonage du PLU et la photo aérienne, eux, sont réels.' : '')
                 + '<br>Touchez « 🔎 Détail » pour savoir pourquoi.');
            document.getElementById('btn-diag').hidden = false;
            return;
          }
          var audit = auditGeom(fc);
          if (audit.souci === 'axes inversés (latitude en premier)') inverserAxes(fc);
          window.__audit = audit;
          poserBati(fc);
          var n = fc.features.length;
          var src = fc.features[0] && fc.features[0].properties.mat_src;
          document.getElementById('btn-diag').hidden = false;
          if (audit.souci){
            statut(n + ' bâtiments — <b>position douteuse</b> : ' + esc(audit.souci)
                 + '<br>Touchez « 🔎 Détail ».');
          } else if (okZones){
            statut(n + ' bâtiments · hauteurs ' + src + ' · '
                 + ZONES.features.length + ' zones du PLU', false);
            setTimeout(function(){ statut('', true); }, 6000);
          } else {
            /* Un échec ne s'efface pas tout seul : c'est précisément le
               message qu'il faut avoir le temps de lire. Il reste
               refermable d'un clic. */
            statut(n + ' bâtiments · hauteurs ' + src
                 + ' — <b>zonage du PLU indisponible</b><br>' + esc(zonesDiag), false);
          }
          if (!okZones) document.getElementById('legend').classList.remove('on');
        });
    })
    .catch(function(err){
      statut('⚠️ Impossible de charger les données : ' + esc(err && err.message));
    });
});
</script>
